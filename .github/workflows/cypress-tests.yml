name: Cypress Tests

on:
  push:
    branches:
      - main
      - consolidacao-qa-automation
  pull_request:
    branches:
      - main
      - consolidacao-qa-automation
  workflow_dispatch:

jobs:
  cypress-tests:
    name: Cypress E2E and API Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: npm run test:security

      - name: Clean previous test reports
        run: node scripts/clean-reports.mjs

      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        env:
          QA_LOGIN_EMAIL: ${{ secrets.QA_LOGIN_EMAIL }}
          QA_LOGIN_PASSWORD: ${{ secrets.QA_LOGIN_PASSWORD }}

      - name: Generate HTML report
        if: always()
        run: npm run report

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-test-reports
          path: |
            cypress/reports/
            cypress/evidencias/
          if-no-files-found: warn
          retention-days: 14
